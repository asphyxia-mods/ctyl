name: Set up ctyl toolchain
description: Installs the pinned, checksum-verified toolchain from scripts/tool-versions.env.
inputs:
  melange:
    description: Prepare the host for melange builds (user namespaces, qemu)
    default: "false"
runs:
  using: composite
  steps:
    - name: Restore tool downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tools/dl
        key: tools-${{ runner.arch }}-${{ hashFiles('scripts/tool-versions.env') }}
    - name: Install tools
      shell: bash
      run: |
        scripts/install-tools.sh
        echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
    - name: Allow bubblewrap sandboxes
      if: inputs.melange == 'true'
      shell: bash
      # Ubuntu 24.04 restricts unprivileged user namespaces, which melange's
      # bubblewrap runner needs. This affects only the ephemeral runner.
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        sudo apt-get install -y -qq bubblewrap >/dev/null
    - name: Emulate aarch64 for package builds
      if: inputs.melange == 'true' && runner.arch == 'X64'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: arm64
